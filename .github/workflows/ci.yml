name: CI

# Runs on every push and pull request: types, unit/API tests, production build and
# the two-PC end-to-end test (two browsers against one real server).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and API tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end (two PCs)
        run: npm run e2e

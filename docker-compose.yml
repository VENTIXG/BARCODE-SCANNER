# Build and run the server from this checkout (development, staging, trying changes).
# Real servers are installed with deploy/install.sh instead: prebuilt images, automatic
# updates with rollback, backups (see deploy/DEPLOY.md).
#   cp .env.example .env   -> set DOMAIN, JWT_SECRET, ADMIN_PASSWORD, COOKIE_SECURE
#   docker compose up -d --build
name: warehouse-ims-dev

services:
  app:
    build: .
    image: warehouse-ims:dev
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (a long random string)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env for the first start}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      REQUIRE_ADMIN_PASSWORD: "true"
    volumes:
      - ims-data:/data
    expose:
      - "4000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env (e.g. ims.example.com, or :80 for a LAN)}
      IMS_TLS: ${IMS_TLS:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/server/caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  ims-data:
  caddy-data:
  caddy-config:

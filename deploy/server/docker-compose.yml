# Warehouse IMS production stack, installed and kept up to date by install.sh and `ims`.
# Settings: .env next to this file (created by install.sh). Data: ./postgres (database),
# ./data (backups). Do not edit here: updates replace this file. Put local changes in
# docker-compose.override.yml instead.
#
# Database: PostgreSQL in its own container, reachable only by the app (no published port).
# A hosted PostgreSQL instead: set DATABASE_URL (and IMS_DB_SCALE=0) in .env.
name: warehouse-ims

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:18
    restart: unless-stopped
    # 0 when DATABASE_URL points to a hosted PostgreSQL.
    scale: ${IMS_DB_SCALE:-1}
    environment:
      POSTGRES_USER: ims
      POSTGRES_DB: ims
      # Servers installed before 1.3 have no POSTGRES_PASSWORD yet: `ims` adds it on its first run.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${JWT_SECRET:?JWT_SECRET is not set in .env}}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
      TZ: ${TZ:-Europe/Athens}
    volumes:
      - ./postgres:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ims -d ims -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
      start_interval: 1s
    logging: *logging

  app:
    image: warehouse-ims:${IMS_VERSION:?IMS_VERSION is not set in .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://ims@db:5432/ims}
      PGPASSWORD: ${POSTGRES_PASSWORD:-${JWT_SECRET}}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set in .env}
      # Used only when the database is created (first start); install.sh clears it afterwards.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      REQUIRE_ADMIN_PASSWORD: "true"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      TZ: ${TZ:-Europe/Athens}
      IMS_STATE_DIR: /ims-state
      IMS_REQUEST_DIR: /ims-requests
      # Cloud copies of backups (optional; set with `ims offsite`).
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_KEEP: ${S3_KEEP:-}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
    volumes:
      - ./data:/data
      - ./state:/ims-state:ro
      - ./requests:/ims-requests
    expose:
      - "4000"
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is not set in .env}
      IMS_TLS: ${IMS_TLS:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  caddy-data:
  caddy-config:

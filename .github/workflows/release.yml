name: Release

# Every push: all tests (CI), server images for x86_64 and arm64, the Windows installer and a
# real auto-update test on Windows. Download the files from the run's "Artifacts".
#
# On the default branch, when package.json has a version that has no GitHub Release yet,
# release v<version> is published. From then on, by themselves:
#   - servers installed with deploy/install.sh update to it at night (backup + rollback),
#   - installed Windows apps download it and install it on the next restart.
# To release: bump the version (npm run version:patch), push.
on:
  push:
    branches: [main, master, 'claude/**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version=$(node -p "require('./package.json').version")
          for f in server/package.json client/package.json; do
            other=$(node -p "require('./$f').version")
            if [ "$other" != "$version" ]; then echo "::error::$f has version $other, package.json has $version"; exit 1; fi
          done
          publish=false
          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] && ! gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            publish=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $version, publish: $publish"

  test:
    uses: ./.github/workflows/ci.yml

  server:
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Server images (x86_64, arm64) and install files
        run: deploy/build-release.sh dist/server linux/amd64,linux/arm64
      - name: The arm64 image is really arm64
        run: |
          gunzip -c dist/server/ims-image-arm64.tar.gz | docker load
          docker image inspect "warehouse-ims:${{ needs.version.outputs.version }}" --format '{{.Architecture}}' | grep -x arm64
      - uses: actions/upload-artifact@v4
        with:
          name: server-release
          path: dist/server/
          retention-days: 30
          if-no-files-found: error

  windows:
    needs: [version, test]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Install
        run: |
          npm ci
          npm ci --prefix desktop
      - name: Build installer
        working-directory: desktop
        run: npm run dist:win
      - name: The update file matches the installer
        shell: pwsh
        working-directory: desktop/release
        run: |
          $yml = Get-Content latest.yml -Raw
          Write-Host $yml
          if ($yml -notmatch "version: ${{ needs.version.outputs.version }}") { throw 'latest.yml has the wrong version' }
          if ($yml -notmatch 'path: Warehouse-IMS-Setup.exe') { throw 'latest.yml points to another file' }
          $sha = [Convert]::ToBase64String([Security.Cryptography.SHA512]::Create().ComputeHash([IO.File]::ReadAllBytes("$PWD/Warehouse-IMS-Setup.exe")))
          if ($yml -notmatch [regex]::Escape("sha512: $sha")) { throw 'latest.yml has a different SHA-512 than the installer' }
      - name: Auto-update test (0.0.1 installed, updates itself)
        shell: pwsh
        run: desktop/scripts/update-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            desktop/release/Warehouse-IMS-Setup.exe
            desktop/release/latest.yml
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: [version, server, windows]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release v${{ needs.version.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          sha256sum VERSION install.sh ims-server.tar.gz ims-image-*.tar.gz Warehouse-IMS-Setup.exe latest.yml > SHA256SUMS
          cat SHA256SUMS
          cat > ../notes.md <<EOF
          Warehouse IMS $VERSION

          **Server (πολλοί υπολογιστές, δικό σας domain):** σε νέο server Ubuntu/Debian:
          \`curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sudo bash\`
          Οι servers που εγκαταστάθηκαν έτσι ενημερώνονται μόνοι τους το βράδυ (backup πρώτα, αυτόματη επιστροφή αν κάτι πάει στραβά).

          **Windows:** κατεβάστε το **Warehouse-IMS-Setup.exe** και εγκαταστήστε το. Στην πρώτη εκκίνηση επιλέξτε «Server της εταιρείας» ή «Μόνο αυτός ο υπολογιστής».
          Τα Windows μπορεί να δείξουν «Τα Windows προστάτευσαν τον υπολογιστή σας» επειδή το πρόγραμμα δεν έχει ψηφιακή υπογραφή: «Περισσότερες πληροφορίες → Εκτέλεση οπωσδήποτε».
          Η εφαρμογή ενημερώνεται μόνη της από την 1.2.0 και μετά.
          EOF
          gh release create "v$VERSION" * --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Warehouse IMS $VERSION" --notes-file ../notes.md --latest

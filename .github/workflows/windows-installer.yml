name: Windows installer

# Builds Warehouse-IMS-Setup-<version>.exe on a real Windows machine.
# - Every push: download it from the run's "Artifacts" (kept 30 days).
# - Pushing a tag like v1.0.1: also publishes a GitHub Release with a permanent
#   link: https://github.com/<owner>/<repo>/releases/latest/download/Warehouse-IMS-Setup.exe
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'claude/**']
    tags: ['v*']
    paths-ignore: ['**.md']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Install desktop tooling
        working-directory: desktop
        run: npm ci

      - name: Build installer
        working-directory: desktop
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: Warehouse-IMS-Setup
          path: desktop/release/*.exe
          retention-days: 30
          if-no-files-found: error

      - name: Publish release
        # Default branch or a v* tag: create (or refresh) the GitHub Release for the
        # version in package.json. The asset keeps a fixed name so this link never changes:
        # https://github.com/<owner>/<repo>/releases/latest/download/Warehouse-IMS-Setup.exe
        if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $exe = Get-ChildItem desktop/release/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName desktop/release/Warehouse-IMS-Setup.exe
          $notes = @"
          Warehouse IMS $version for Windows.

          Download **Warehouse-IMS-Setup.exe**, double-click and install.
          Windows may show "Windows protected your PC" because the installer is not code-signed: click **More info → Run anyway**.
          First sign-in: admin / admin123 (you will be asked to change it). Your data stays on your PC in %APPDATA%\Warehouse IMS.
          "@
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag desktop/release/Warehouse-IMS-Setup.exe --clobber
          } else {
            gh release create $tag desktop/release/Warehouse-IMS-Setup.exe --target $env:GITHUB_SHA --title "Warehouse IMS $version" --notes $notes --latest
          }

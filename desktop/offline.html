<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Warehouse IMS: χωρίς σύνδεση</title>
    <style>
      :root { --bg: #f5f6f8; --surface: #fff; --fg: #111827; --muted: #6b7280; --line: #e5e7eb; --brand: #1d4ed8; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0b0f17; --surface: #131a26; --fg: #e5e7eb; --muted: #9ca3af; --line: #263041; --brand: #3b82f6; }
      }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--fg); }
      .box { max-width: 520px; padding: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 12px; }
      code { font-size: 13px; }
      .row { display: flex; gap: 8px; margin-top: 16px; }
      button { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-weight: 600; cursor: pointer; }
      button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Δεν υπάρχει σύνδεση με τον server</h1>
      <p>Η εφαρμογή δεν μπορεί να φτάσει στο <code id="url"></code>.</p>
      <p>Ελέγξτε τη σύνδεση στο internet. Αν όλοι οι υπολογιστές έχουν το ίδιο πρόβλημα, ο server μπορεί να ενημερώνεται ή να είναι εκτός λειτουργίας.</p>
      <p><small id="error"></small></p>
      <p id="countdown"></p>
      <div class="row">
        <button id="retry" class="primary" type="button">Δοκιμή ξανά</button>
        <button id="change" type="button">Αλλαγή server</button>
      </div>
    </div>
    <script src="offline.js"></script>
  </body>
</html>

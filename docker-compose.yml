# Production stack: the app plus Caddy (HTTPS). Configure with a .env file next to this file.
#   cp .env.example .env   -> set DOMAIN, JWT_SECRET, ADMIN_PASSWORD, COOKIE_SECURE
#   docker compose up -d --build
name: warehouse-ims

services:
  app:
    build: .
    image: warehouse-ims:${IMS_TAG:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (a long random string)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env for the first start}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      REQUIRE_ADMIN_PASSWORD: "true"
    volumes:
      - ims-data:/data
    expose:
      - "4000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env (e.g. ims.example.com, or :80 for a LAN)}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  ims-data:
  caddy-data:
  caddy-config:
